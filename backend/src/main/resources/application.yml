spring:
  application:
    name: arohana-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/arohana?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASS:yashwanth}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        type:
          preferred_uuid_jdbc_type: VARCHAR
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  websocket:
    enabled: true

arohana:
  jwt:
    secret: ${JWT_SECRET:replace-this-with-a-256-bit-secret-in-production}
    expiry-hours: 24
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

server:
  port: 8080

logging:
  level:
    com.arohana: DEBUG
    org.springframework.security: INFO

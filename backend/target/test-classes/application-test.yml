spring:
  datasource:
    url: jdbc:h2:mem:arohana_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

arohana:
  jwt:
    secret: test-secret-key-that-is-long-enough-for-hs256-algorithm
    expiry-hours: 1
